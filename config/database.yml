# PostgreSQL. Credentials and host come from the environment (see docker-compose.yml).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: shipment_tracker_development

# The test database is erased and re-generated when you run the tests.
test:
  <<: *default
  database: shipment_tracker_test

# Provide the password (or a full DATABASE_URL) as an environment variable.
production:
  <<: *default
  database: shipment_tracker_production
  username: shipment_tracker
  password: <%= ENV["SHIPMENT_TRACKER_DATABASE_PASSWORD"] %>
